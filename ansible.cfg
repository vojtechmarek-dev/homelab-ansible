[defaults]
# Auto-load both the host inventory and the external (vaulted) secrets inventory,
# so plain `ansible-playbook playbooks/apps.yml` works without -i flags.
inventory = inventory.yml,../ansible-secrets/secrets.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = False
