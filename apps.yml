---
# Docker application stacks, all driven by the generic `docker_stack` role.
# Per-app config lives in each play's `vars:` (play-scoped — no cross-app
# collision when several apps share a host like kuzelovlab).
#
# `stack_*` vars are consumed by the role. The remaining vars (project_path,
# db_path, domain, secrets, ...) are referenced *inside* the compose/env
# templates and are passed through unchanged so rendered output is identical
# to the old per-app playbooks.
#
# Run everything:        ansible-playbook apps.yml --ask-vault-pass -K
# Run one app:           ansible-playbook apps.yml --limit adguard_servers ...
# (ANSIBLE_CONFIG must point at this repo's ansible.cfg — see README.)

- name: Deploy AdGuard Home
  hosts: adguard_servers
  become: true
  gather_facts: false
  vars:
    stack_name: adguard-home
    stack_path: /srv/adguard-home
    stack_compose_template: adguard-home/docker-compose.yml.j2
    stack_pull: always
    stack_recreate: auto
    stack_extra_dirs:
      - /srv/adguard-home/data
      - /srv/adguard-home/data/work
      - /srv/adguard-home/data/conf
    app_data_path: /srv/adguard-home/data
  roles:
    - docker_stack

