    stack_extra_dirs:
      - /srv_fast/seafile/db
      - /mnt/samba_share/seafile_data
    domain: zen132.cz
    db_path: /srv_fast/seafile/db
    app_data_path: /mnt/samba_share/seafile_data
  roles:
    - docker_stack

