---
host_tailscale_ip: "100.99.5.102"

# Site B has no route to kuzelovlab's LAN address — a request to
# 192.168.0.20:8085 from here times out — so pushes to Gotify go over the
# tailnet instead. Gotify's published port answers on kuzelovlab's Tailscale
# address as well.
gotify_url: "http://{{ hostvars['kuzelovlab'].host_tailscale_ip }}:8085"

# Filesystems the disk_alert role watches on this host (role default: only /).
# /mnt/backup_tank is a separate disk holding both Borg repositories — this
# host's own and kuzelovlab's off-site copy — so when it fills, every backup
# stops at once.
disk_alert_paths:
  - /
  - /mnt/backup_tank
