all:
  # --- GLOBAL VARIABLES FOR AUTOMATION ---
  vars:
    # Tell Ansible to ALWAYS connect as this user
    ansible_user: ansible-manager
    ansible_ssh_private_key_file: ~/.ssh/ansible_manager_homelab_rsa

  children:
    # --- Infrastructure Groups ---
    proxmox_vms:
      hosts:
        kuzelovlab:
          ansible_host: 192.168.0.20
        medialab:
          ansible_host: 192.168.0.30
    
    physical_servers:
      hosts:
        homelab-thinkcentre:
          ansible_host: 192.168.66.166
        homelab-pi:
          ansible_host: 192.168.66.167

    # --- Functional Groups (The "What runs where") ---
    docker_nodes:
      hosts:
        kuzelovlab:
        medialab:
        homelab-thinkcentre:
        homelab-pi:

    # --- Services ---
    adguard_servers:
      hosts:
        kuzelovlab:
        homelab-thinkcentre:

    borg_servers:
      hosts:
        homelab-thinkcentre:

    caddy_servers:
      hosts:
        kuzelovlab:
          caddy_template: "Caddyfile.kuzelovlab.private.j2"
          domain: "zen132.cz"
        homelab-thinkcentre:
          caddy_template: "Caddyfile.homelab.private.j2"
          domain: "vojtechmarek.dev"

    borgmatic_servers:
      hosts:
        kuzelovlab:
          borgmatic_config_template: "borgmatic-config.kuzelovlab.yaml.j2"
          borgmatic_docker_compose_template: "borgmatic.kuzelovlab.docker-compose.yml.j2"
          borgmatic_cron_hour: "4"
        homelab-thinkcentre:
          borgmatic_config_template: "borgmatic-config.homelab.yaml.j2"
          borgmatic_docker_compose_template: "borgmatic.homelab.docker-compose.yml.j2"
          borgmatic_cron_hour: "5" # Run backup at 5:00 AM on homelab-thinkcentre to avoid overlapping with kuzelovlab's 4:00 AM schedule

    discord_bot_servers:
      hosts:
        homelab-pi:

    dockhand_servers:
      hosts:
        kuzelovlab:
        medialab:
        homelab-thinkcentre:

    homepage_servers:
      hosts:
        homelab-thinkcentre:

    immich_servers:
      hosts:
        kuzelovlab:

    nextcloud_servers:
      hosts:
        homelab-thinkcentre:

    samba_servers:
      hosts:
        kuzelovlab:

    seafile_servers:
      hosts:
        kuzelovlab:

    stirling_pdf_servers:
      hosts:
        kuzelovlab:
        homelab-thinkcentre:

    tailscale_servers:
      hosts:
        homelab-thinkcentre:
        homelab-pi:
        kuzelovlab:
        medialab:

    lvm_storage_servers:
      hosts:
        homelab-thinkcentre:
