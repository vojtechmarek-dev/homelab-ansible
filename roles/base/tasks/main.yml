---
# Install required packages on the host

- name: "Disable all apt recommendations and suggestions"
  copy:
    src: "99local"
    dest: "/etc/apt/apt.conf.d/99local"
    owner: root
    group: root
    mode: 0644
  tags: ['config']
    

- name: "Uninstall rsyslog"
  apt: {name: "rsyslog", state: absent, purge: yes, autoremove: yes}
  when: remove_rsyslog|d(false)
  tags: ['cleanup']

- name: "Remove unneeded Ubuntu packages"
  apt:
    name:
      - "accountsservice"
      - "byobu"
      - "fwupd"
      - "libfwupd2"
      - "haveged"
      - "lvm2"
      - "mdadm"
      - "multipath-tools"
      - "packagekit"
      - "plymouth"
      - "snapd"
      - "ufw"
    state: absent
    purge: yes
    autoremove: yes
  when: ansible_facts['distribution'] == "Ubuntu"
  tags: ['cleanup']

- name: "Upgrade the system"
  become: true
  apt:
    update_cache: yes
    upgrade: dist
  tags: ['update']

- name: Install useful tools and programs
  become: true
  ansible.builtin.package:
    name:
      - curl
      - nano
      - sudo
      - htop
      - atop
      - screen
      - net-tools
      - sysstat
      - iotop
      - python3-pip
      - resolvconf
    state: present
    update_cache: true
  tags: ['packages']

- name: Install resolvconf to support dns-nameservers in interfaces file
  ansible.builtin.apt:
    name: resolvconf
    state: present
    update_cache: yes

- name: "Install man pages"
  apt:
    name: ["man-db", "manpages"]
    state: present
  tags: ['packages']

- name: Enable IPv4 forwarding (Required for Tailscale Subnet Routing)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Create Tailscale iptables script
  ansible.builtin.copy:
    dest: /usr/local/bin/tailscale-routing-fix.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Allow traffic to flow in and out of the Tailscale tunnel
      iptables -I FORWARD -i tailscale0 -j ACCEPT
      iptables -I FORWARD -o tailscale0 -j ACCEPT

      # Fix physical MTU to prevent fragmentation
      # /usr/sbin/ip link set eno1 mtu 1400

      # Enable IP Forwarding
      /usr/sbin/sysctl -w net.ipv4.ip_forward=1
      
      # IF you also needed the MASQUERADE command to make it work, uncomment the line below 
      # and ensure 'ens18' matches your actual primary network interface!
      # iptables -t nat -A POSTROUTING -o ens18 -j MASQUERADE

- name: Create Systemd service for Tailscale routing
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscale-routing-fix.service
    mode: '0644'
    content: |
      [Unit]
      Description=Tailscale Routing Firewall Rules
      # Run this AFTER Docker starts so Docker doesn't overwrite our rules
      After=network-online.target docker.service 

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/tailscale-routing-fix.sh
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Tailscale routing service
  ansible.builtin.systemd:
    name: tailscale-routing-fix
    enabled: yes
    daemon_reload: yes
    state: started