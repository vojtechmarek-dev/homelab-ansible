---
# Gotify push when a filesystem runs low on free space.
#
# Run:  ansible-playbook server_disk_alert.yml --ask-vault-pass -K
#
# Needs a Gotify application token in the vault as `gotify_app_token`. Until
# that exists the deployed script exits silently, so this is safe to run early.
#
# What each host watches (disk_alert_paths), its threshold
# (disk_alert_free_percent) and how it reaches Gotify (gotify_url) are per-host
# settings in host_vars/<host>.yml. They are deliberately not set here: play
# vars outrank host_vars and would flatten every host to the same list. A host
# with no entry falls back to the role default and watches only /.

- name: Deploy disk space alerting
  hosts: docker_nodes
  become: true
  gather_facts: false
  roles:
    - disk_alert
